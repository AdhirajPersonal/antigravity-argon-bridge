<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Cyan to Purple Noble Gas Gradient -->
    <linearGradient id="ab-shell-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Bridge Conduit Gradient -->
    <linearGradient id="ab-bridge-grad" x1="4" y1="32" x2="60" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="ab-core-glow" cx="32" cy="32" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0d1520" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Core Glow -->
  <circle cx="32" cy="32" r="16" fill="url(#ab-core-glow)" />

  <!-- Shell 3: Noble Hexagonal Containment -->
  <path
    d="M32 5L55.38 18.5V45.5L32 59L8.62 45.5V18.5L32 5Z"
    stroke="url(#ab-shell-grad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.9"
  />

  <!-- Shell 2: Dual Broken Quantum Orbitals -->
  <path
    d="M32 13A19 19 0 0 1 50.34 27M32 51A19 19 0 0 1 13.66 37"
    stroke="#38bdf8"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />
  <path
    d="M47 43.6A19 19 0 0 1 37 50.34M17 20.4A19 19 0 0 1 27 13.66"
    stroke="#a855f7"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />
  <!-- Orbital Electrons -->
  <circle cx="32" cy="13" r="2.4" fill="#38bdf8" />
  <circle cx="32" cy="51" r="2.4" fill="#a855f7" />

  <!-- The Bridge: Multi-Account Neural Gateway Arcs -->
  <path
    d="M9 32C18 23 46 23 55 32"
    stroke="url(#ab-bridge-grad)"
    stroke-width="2.8"
    stroke-linecap="round"
  />
  <path
    d="M9 32C18 41 46 41 55 32"
    stroke="url(#ab-bridge-grad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-opacity="0.65"
  />

  <!-- Account Portal Nodes -->
  <circle cx="8.6" cy="32" r="3.6" fill="#0d1520" stroke="#10b981" stroke-width="2.8" />
  <circle cx="55.4" cy="32" r="3.6" fill="#0d1520" stroke="#a855f7" stroke-width="2.8" />

  <!-- Shell 1: Inner K-Shell + Gemini 4 Reasoning Spark -->
  <circle
    cx="32"
    cy="32"
    r="8.4"
    stroke="#38bdf8"
    stroke-width="2"
    stroke-dasharray="4 4"
    stroke-opacity="0.6"
  />
  <path
    d="M32 22.4C32 27.7 36.3 32 41.6 32C36.3 32 32 36.3 32 41.6C32 36.3 27.7 32 22.4 32C27.7 32 32 27.7 32 22.4Z"
